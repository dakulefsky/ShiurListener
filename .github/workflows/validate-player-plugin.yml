name: Validate Otzaria player plugin
on:
  push:
    paths: ['player/**', '.github/workflows/validate-player-plugin.yml']
  pull_request:
    paths: ['player/**', '.github/workflows/validate-player-plugin.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: player
      - name: Playback, persistence and offline-analysis regression tests
        run: node --test player/tests/test_load_reliability.cjs player/tests/test_offline_analysis.cjs player/tests/test_minimum_duration.cjs player/tests/test_resume.cjs player/experiments/browser-two-check/test_guards.cjs player/experiments/browser-two-check/test_deadline.cjs
      - name: Check store manifest metadata
        run: node player/build/check_store_manifest.cjs
      - name: Validate and build with the official Otzaria validator
        uses: Otzaria/otzaria-plugin-validator@64ee7c7806a03fcba16c111a7b6c3185e4d92804 # v1.19.1
        with:
          path: player/plugin
          fail-on-warnings: 'true'
          build: 'true'
          publish: 'false'
