name: Validate standalone player
on:
  push:
    paths:
      - 'standalone/**'
      - '.github/workflows/validate-standalone.yml'
  workflow_dispatch:
    inputs:
      installer_version:
        description: 'Candidate installer version to verify before activating the update channel'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            standalone
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit and desktop tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s standalone/tests -v
      - name: Native Windows mini-player mouse input
        if: runner.os == 'Windows'
        run: python standalone/tests/run_suite.py test_windows_native.py
      - name: Unit and desktop tests (Windows, including native mini-player mouse input)
        if: runner.os == 'Windows'
        run: python standalone/tests/run_suite.py
      - name: Fetch verified Windows VLC runtime for integration test
        if: runner.os == 'Windows'
        run: python standalone/tests/fetch_test_runtime.py
      - name: Verify offline speech model and conversion through bundled VLC
        if: runner.os == 'Windows'
        run: python -c "import runpy; p=runpy.run_path('standalone/build/release.py'); a=p['download_hush_assets'](); a.update(p['download_vlc_callback_assets']()); p['smoke_test_hush'](a, True)"
      - name: Measure native speech enhancement quality and long-file performance
        if: runner.os == 'Windows'
        run: python standalone/tests/test_speech_enhancement_native.py
      - name: Profile VLC conversion versus native denoising on a 60-second source
        if: runner.os == 'Windows'
        run: python standalone/tests/profile_speech_conversion.py
      - name: Upload speech enhancement listening samples
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-enhancement-listening-samples
          path: standalone/test-results/speech-enhancement/
          if-no-files-found: warn
          retention-days: 14
      - name: Actual Windows desktop controls with real VLC (dummy audio output)
        if: runner.os == 'Windows'
        run: python standalone/tests/test_desktop_vlc.py
      - name: Native packaged installer, shortcut identity and repair
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.installer_version != ''
        env:
          SHIUR_INSTALLER_VERSION: ${{ inputs.installer_version }}
        run: python standalone/tests/test_windows_installation.py
      - uses: actions/setup-go@v5
        if: runner.os == 'Linux'
        with:
          go-version: '1.24.x'
          cache: false
      - name: Installer extraction and repair tests
        if: runner.os == 'Linux'
        env:
          GO111MODULE: 'off'
        run: go test -v ./standalone/build/installer
